name: Web build

# Verifies the project and publishes the web export to GitHub Pages.
#
# Pages must be set to "GitHub Actions" as its source once, by hand, under
# Settings -> Pages. Until that is done this workflow builds and verifies fine
# and the deploy step fails.

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Fetch Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"

          curl -sSL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64

          # The templates archive is ~1.3 GB, which is why this step is cached.
          curl -sSL -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.stable/

      - name: Verify
        # All four checks. A red verify must not ship.
        run: |
          export GODOT="$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          tools/verify.sh

      - name: Export web
        run: |
          set -euo pipefail
          mkdir -p build/web
          "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" \
            --headless --export-release "Web" build/web/index.html
          ls -lh build/web

      - name: Guard against a broken export
        # A failed export can still leave an index.html behind, so check that
        # the WebAssembly payload is actually there and is not a stub.
        run: |
          test -f build/web/index.wasm
          test "$(stat -c%s build/web/index.wasm)" -gt 5000000

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
